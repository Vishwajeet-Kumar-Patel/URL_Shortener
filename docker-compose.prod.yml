# Production Docker Compose Configuration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    restart: always
    # Production: Use environment file instead of inline
    env_file:
      - .env.production
    # Production: Don't expose to host, use reverse proxy
    ports: []
    expose:
      - "5000"
    networks:
      - linkshort-network
    # Stricter healthcheck for production
    healthcheck:
      test: node -e "require('http').get('http://localhost:5000/api/v1/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  web:
    restart: always
    env_file:
      - .env.production
    # Production: Don't expose to host, use reverse proxy
    ports: []
    expose:
      - "3000"
    networks:
      - linkshort-network
    # Stricter healthcheck for production
    healthcheck:
      test: node -e "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  linkshort-network:
    driver: bridge

volumes:
